# SonarQube Cloud analysis settings.
#
# The scan runs from CI (see .github/workflows/ci.yml) rather than from SonarQube Cloud's
# Automatic Analysis, because Automatic Analysis cannot import a coverage report — and the
# coverage this project already produces is the main thing worth sending.

sonar.projectKey=DinoSaulo_Motorcycle-Comparator-UI
sonar.organization=dinosaulo
sonar.projectName=Motorcycle Comparator UI

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Tests live beside the code they cover, so the two scopes are separated by pattern rather
# than by directory. Everything matching `sonar.test.inclusions` is indexed as test code —
# Sonar applies test-specific rules to it and leaves it out of the coverage denominator.
# `src/testing/**` holds fixtures and setup helpers: not tests themselves, but test-scope
# code that should not be measured as production source either.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/testing/**

# Written by `npm run test:coverage`; the lcov reporter is already configured in
# vite.config.js. Without this line Sonar reports the whole project as 0% covered.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Kept in step with the `coverage.exclude` list in vite.config.js. When the two disagree,
# Sonar reports files as 0% covered that the coverage run never instrumented in the first
# place — a mismatch that shows up as a sudden, unexplained coverage drop.
sonar.coverage.exclusions=src/main.jsx,src/testing/**,src/i18n/translations/**

# Static assets carry nothing for the analyser to inspect.
sonar.exclusions=src/assets/**
